<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            height: 1200px;
        }
        .header{
            position: sticky;
            top:0px;
            background-color: #ff5733;
            color:white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }
        .container{
            display: inline-block;
        }
        .sidebar{
            width: 200px;
            height: 100vh;
            background-color: #f4f4f4;
            padding: 15px;
            position:sticky;
            top:60px;
            margin-left:1000px;
        }
        .content{
            padding: 20px;
        }
        .box{
            height: 200px;
            background-color: lightblue;
            margin-bottom:20px ;
            text-align: center;
            line-height: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">Sticky Example</div>
    <div class="container">
        <div class="sidebar">
            <p><b>Sticky Sidebar</b></p>
            <p>Example - 1</p>
            <p>Example - 2</p>
            <p>Example - 3</p>
        </div>
        <div class="content">
            <div class="box">Content -1</div>
            <div class="box">Content -2</div>
            <div class="box">Content -3</div>
            <div class="box">Content -4</div>
            <div class="box">Content -5</div>
        </div>
    </div>
</body>
</html>

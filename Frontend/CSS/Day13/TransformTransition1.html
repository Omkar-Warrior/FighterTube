<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>More Connected Squares</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
    }

    .circle-container {
      position: relative;
      width: 300px;
      height: 300px;
    }

    .square {
      width: 50px;
      height: 50px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: center;
      border: 2px solid black;
    }

    /* Adjusted: translate(70px) for tighter connection (60% overlap) */

    .square:nth-child(1) {
      transform: rotate(0deg) translate(70px) rotate(0deg);
      background: #e74c3c;
      border-radius: 0%;
      z-index: 1;
    }

    .square:nth-child(2) {
      transform: rotate(30deg) translate(70px) rotate(-30deg);
      background: #8e44ad;
      border-radius: 5%;
      z-index: 2;
    }

    .square:nth-child(3) {
      transform: rotate(60deg) translate(70px) rotate(-60deg);
      background: #3498db;
      border-radius: 10%;
      z-index: 3;
    }

    .square:nth-child(4) {
      transform: rotate(90deg) translate(70px) rotate(-90deg);
      background: #1abc9c;
      border-radius: 15%;
      z-index: 4;
    }

    .square:nth-child(5) {
      transform: rotate(120deg) translate(70px) rotate(-120deg);
      background: #27ae60;
      border-radius: 20%;
      z-index: 5;
    }

    .square:nth-child(6) {
      transform: rotate(150deg) translate(70px) rotate(-150deg);
      background: #f39c12;
      border-radius: 25%;
      z-index: 6;
    }

    .square:nth-child(7) {
      transform: rotate(180deg) translate(70px) rotate(-180deg);
      background: #d35400;
      border-radius: 30%;
      z-index: 7;
    }

    .square:nth-child(8) {
      transform: rotate(210deg) translate(70px) rotate(-210deg);
      background: #2c3e50;
      border-radius: 35%;
      z-index: 8;
    }

    .square:nth-child(9) {
      transform: rotate(240deg) translate(70px) rotate(-240deg);
      background: #7f8c8d;
      border-radius: 40%;
      z-index: 9;
    }

    .square:nth-child(10) {
      transform: rotate(270deg) translate(70px) rotate(-270deg);
      background: #9b59b6;
      border-radius: 45%;
      z-index: 10;
    }

    .square:nth-child(11) {
      transform: rotate(300deg) translate(70px) rotate(-300deg);
      background: #2980b9;
      border-radius: 50%;
      z-index: 11;
    }

    .square:nth-child(12) {
      transform: rotate(330deg) translate(70px) rotate(-330deg);
      background: #16a085;
      border-radius: 100%;
      z-index: 12;
    }
  </style>
</head>
<body>

  <div class="circle-container">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

</body>
</html>

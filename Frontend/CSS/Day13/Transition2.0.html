<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition 2.0 </title>
    <style>
        img{
            width: 100px;
            transition: transform 4s ease;
            cursor: pointer;
        }
        img:hover{
            transform: translate(400px,400px) scale(3) rotate(1080deg);
        }
    </style>
</head>
<body>
    <img src="./star.webp" alt="">
</body>
</html>

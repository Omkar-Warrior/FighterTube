<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .dancing-text{
            margin: 200px auto;
            width: 500px;
            font-size: 100px;
        }
        .dancing-text span{
            display: inline-block;
            animation:moveFade 2s ease-in-out infinite alternate;
            color:rgb(235, 51, 177);
        }
        @keyframes moveFade {
            0%{
                transform: translateX(0);
                opacity: 0.1;
                color:rgb(255,0, 0);

            }
            50%{
                transform: translateX(50px);
                opacity: 0.2;
                color:rgb(38,5,255);
            }
            100%{
                transform: translateX(-10px);
                opacity: 1;
                color:rgb(235, 51, 177);

            }
        }
      /*  @keyframes dance {
            0%,100%{
                transform: translateY(0);
            }
            50%{
                transform: translateY(-40px);
            }
            
        }*/
        .dancing-text span:nth-child(1){
            animation-delay: 0s;
        }s
         .dancing-text span:nth-child(2){
            animation-delay: 0.1s;
         }
         .dancing-text span:nth-child(3){
            animation-delay: 0.2s;
        }
         .dancing-text span:nth-child(4){
            animation-delay: 0.3s;
        }
         .dancing-text span:nth-child(5){
            animation-delay: 0.4s;
        }
    </style>
</head>
<body>
    <h1 class="dancing-text">
        <span>D</span>
        <span>A</span>
        <span>N</span>
        <span>C</span>
        <span>E</span>

    </h1>
</body>
</html>

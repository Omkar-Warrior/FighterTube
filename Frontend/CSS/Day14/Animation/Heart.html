<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .heart{
            width: 100px;
            height: 90px;
            background-color: red;
            position: relative;
            transition: rotate(-45deg);
            animation: beat 1s infinite;
            margin: 150px auto;
        }
        .heart::before{
            top:-50px;
            left:0px;
        }
        .heart::after{
            left:50px;
            top:0px;
        }
        .heart::before,.heart::after{
            content: "";
            width: 100px;
            height: 90px;
            background-color: red;

            position:absolute;
            border-radius: 50px;
        }
        @keyframes beat {
            0%,100%{
                transform: scale(1) rotate(-45deg);
            }
            50%{
                transform: scale(1.1) rotate(-45deg);
            }
            
        }
    </style>
</head>
<body>
    <div class="heart"></div>
</body>
</html>

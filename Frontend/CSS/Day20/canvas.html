<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #canvas{
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>As a Developer We cant use it, its For Graphic Designers</h1>
    <canvas id="canvas" width="400" height="400"></canvas>
    <script>
        var c= document.getElementById("canvas");
        var ctx =c.getContext("2d");
        ctx.moveTo(0,0);
        ctx.lineTo(400,400);
        ctx.stroke();
        ctx.moveTo(400,0);
        ctx.lineTo(0,400);
        ctx.stroke()
        ctx.beginPath();
        ctx.arc(200,200,200,0,360)
        ctx.stroke()
    </script>
</body>
</html>
